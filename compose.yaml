services:
  prefect:
    build: .
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_SERVER_ANALYTICS_ENABLED: 'false'
      PREFECT_UI_API_URL: http://localhost:4200/api
    volumes:
      - prefect-state:/root/.prefect
    ports: ['127.0.0.1:4200:4200']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
  train:
    build: .
    command: python pipeline.py
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      OPENBLAS_NUM_THREADS: '2'
    volumes: ['dataset:/app/data', 'artifacts:/app/artifacts']
    depends_on:
      prefect: {condition: service_healthy}
  scheduler:
    build: .
    command: python pipeline.py --serve
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      OPENBLAS_NUM_THREADS: '2'
    volumes: ['dataset:/app/data', 'artifacts:/app/artifacts']
    depends_on:
      train: {condition: service_completed_successfully}
    restart: unless-stopped
  api:
    build: .
    environment:
      APP_ENV: cloud VM via private SSH tunnel
    ports: ['127.0.0.1:8000:8000']
    volumes: ['artifacts:/app/artifacts']
    depends_on:
      train: {condition: service_completed_successfully}
    restart: unless-stopped
volumes:
  prefect-state:
  dataset:
  artifacts:
